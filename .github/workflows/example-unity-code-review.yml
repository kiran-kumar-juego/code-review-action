name: Unity Code Review - Sample Project

on:
  pull_request:
    paths: 
      - 'Assets/**/*.cs'
  push:
    branches: [ main, master, development ]
    paths: 
      - 'Assets/**/*.cs'
  workflow_dispatch:
    inputs:
      analyze_all_files:
        description: 'Analyze all C# files in Assets folder (not just changed files)'
        required: false
        default: 'false'
        type: boolean

jobs:
  code-review:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Run Unity Code Analysis
        uses: https://internal-git.juegostudio.net/git/UnityProjects/code-review-action.git@development
        with:
          github-token: ${{ secrets.TOKEN }}
          
      - name: Upload Analysis Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unity-code-review-report
          path: unity-analysis-report.md
          retention-days: 30
