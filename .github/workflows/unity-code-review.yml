name: Unity Code Review with AI Analysis

on:
  pull_request:
    branches: [ master, main, development, release/** ]
    paths:
      - 'Assets/**/*.cs'

  workflow_dispatch:
    inputs:
      analyze_all_files:
        description: 'Analyze all C# files in Assets folder (not just changed files)'
        required: false
        default: 'false'
        type: boolean
jobs:
  code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Get changed files 
        id: changed-files
        if: github.event_name == 'pull_request'
        run: |
          echo "Getting changed files from pull request..."
          # Use git to get changed files between base and head
          git fetch origin ${{ github.event.pull_request.base.ref }}
          changed_files=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD | grep "\.cs$" | grep "^Assets/" || true)
          
          if [ -n "$changed_files" ]; then
            echo "all_changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "$changed_files" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
            echo "No C# files changed in Assets folder"
          fi
        continue-on-error: true

      - name: Get all files for manual dispatch
        id: all-files
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "=== MANUAL DISPATCH FILE DETECTION ==="
          echo "analyze_all_files input: '${{ github.event.inputs.analyze_all_files }}'"
          
          if [ "${{ github.event.inputs.analyze_all_files }}" == "true" ]; then
            echo "Finding all C# files in Assets folder..."
            if [ -d "Assets" ]; then
              all_cs_files=$(find Assets -name "*.cs" -type f)
              file_count=$(echo "$all_cs_files" | wc -l)
              echo "all_changed_files<<EOF" >> $GITHUB_OUTPUT
              echo "$all_cs_files" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
              echo "any_changed=true" >> $GITHUB_OUTPUT
              echo "Found $file_count C# files"
            else
              echo "Assets folder not found"
              echo "any_changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "Getting recently modified files (last 7 days)..."
            if [ -d "Assets" ]; then
              recent_files=$(find Assets -name "*.cs" -type f -mtime -7)
              if [ -n "$recent_files" ]; then
                file_count=$(echo "$recent_files" | wc -l)
                echo "all_changed_files<<EOF" >> $GITHUB_OUTPUT
                echo "$recent_files" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT
                echo "any_changed=true" >> $GITHUB_OUTPUT
                echo "Found $file_count recently modified files"
              else
                echo "No recently modified C# files found - defaulting to ALL files"
                # Default to all files if no recent files found
                all_cs_files=$(find Assets -name "*.cs" -type f)
                file_count=$(echo "$all_cs_files" | wc -l)
                echo "all_changed_files<<EOF" >> $GITHUB_OUTPUT
                echo "$all_cs_files" >> $GITHUB_OUTPUT
                echo "EOF" >> $GITHUB_OUTPUT
                echo "any_changed=true" >> $GITHUB_OUTPUT
                echo "Defaulted to all $file_count C# files"
              fi
            else
              echo "Assets folder not found"
              echo "any_changed=false" >> $GITHUB_OUTPUT
            fi
          fi
          echo "=== END FILE DETECTION ==="

      - name: Debug Analysis Conditions
        run: |
          echo "=== DEBUG INFORMATION ==="
          echo "Event name: ${{ github.event_name }}"
          echo "analyze_all_files input: '${{ github.event.inputs.analyze_all_files }}'"
          echo "Changed files any_changed: '${{ steps.changed-files.outputs.any_changed }}'"
          echo "All files any_changed: '${{ steps.all-files.outputs.any_changed }}'"
          echo "PR condition result: ${{ github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true' }}"
          echo "Dispatch condition result: ${{ github.event_name == 'workflow_dispatch' && steps.all-files.outputs.any_changed == 'true' }}"
          echo "Overall condition result: ${{ (github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true') || (github.event_name == 'workflow_dispatch' && steps.all-files.outputs.any_changed == 'true') }}"

      - name: Unity Code Analysis
        if: (github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true') || (github.event_name == 'workflow_dispatch' && steps.all-files.outputs.any_changed == 'true')
        run: |
          echo "Analyzing Unity project structure..."
          
          # Ensure we're in the right directory and Assets folder exists
          echo "Current directory: $(pwd)"
          echo "Assets folder exists: $([ -d "Assets" ] && echo "Yes" || echo "No")"
          
          # Determine which files to analyze
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            files_to_analyze="${{ steps.changed-files.outputs.all_changed_files }}"
            analysis_type="Changed Files (Pull Request)"
          else
            files_to_analyze="${{ steps.all-files.outputs.all_changed_files }}"
            if [ "${{ github.event.inputs.analyze_all_files }}" == "true" ]; then
              analysis_type="All Files (Manual Dispatch)"
            else
              analysis_type="Recently Modified Files (Manual Dispatch)"
            fi
          fi
          
          # Handle case where no files are found
          if [ -z "$files_to_analyze" ] && [ -d "Assets" ]; then
            echo "No specific files to analyze, finding all C# files in Assets..."
            files_to_analyze=$(find Assets -name "*.cs" -type f | tr '\n' ' ')
            analysis_type="All Available Files (Fallback)"
          fi
          
          # Create analysis report
          echo "# Unity Code Review Report" > code_analysis.md
          echo "" >> code_analysis.md
          echo "**Analysis Type:** $analysis_type" >> code_analysis.md
          echo "**Trigger:** ${{ github.event_name }}" >> code_analysis.md
          echo "**Repository:** $(basename "$(pwd)")" >> code_analysis.md
          echo "" >> code_analysis.md
          echo "## 📊 Summary:" >> code_analysis.md
          
          if [ -n "$files_to_analyze" ]; then
            file_count=$(echo "$files_to_analyze" | wc -w)
            echo "- **Files Analyzed:** $file_count" >> code_analysis.md
          else
            echo "- **Files Analyzed:** 0 (No C# files found or no changes detected)" >> code_analysis.md
          fi
          echo "- **Analysis Date:** $(date '+%Y-%m-%d %H:%M:%S')" >> code_analysis.md
          echo "" >> code_analysis.md

      - name: Unity Code Analysis with Custom Script
        if: (github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true') || (github.event_name == 'workflow_dispatch' && steps.all-files.outputs.any_changed == 'true')
        run: |
          echo "Running Unity Code Analysis..."
          
          # Check if custom analyzer script exists, if not skip this step
          if [ -f ".github/scripts/unity-analyzer.sh" ]; then
            chmod +x .github/scripts/unity-analyzer.sh
            
            # Run the analyzer and capture the exit code
            set +e  # Don't exit on error
            ./.github/scripts/unity-analyzer.sh
            analyzer_exit_code=$?
            set -e  # Re-enable exit on error
            
            # Always add the analysis to our report, regardless of exit code
            echo "" >> code_analysis.md
    
            echo "" >> code_analysis.md
            if [ -f "unity-analysis-report.md" ]; then
              cat unity-analysis-report.md >> code_analysis.md
            else
              echo "Unity analysis report not found" >> code_analysis.md
            fi
            
            # Show the exit code for debugging but don't fail the workflow
            echo "Unity analyzer completed with exit code: $analyzer_exit_code"
          else
            echo "Custom Unity analyzer script not found, skipping..."
            echo "" >> code_analysis.md
    
            echo "" >> code_analysis.md
            echo "## Custom Unity Analysis" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "*Custom analyzer script not found - using built-in analysis only*" >> code_analysis.md
            echo "" >> code_analysis.md
          fi

      - name: Unity Specific Code Quality Checks
        if: (github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true') || (github.event_name == 'workflow_dispatch' && steps.all-files.outputs.any_changed == 'true')
        run: |
          echo "Running Unity-specific code quality checks..."
          
          # Check for common Unity anti-patterns
          echo "## Unity Code Quality Analysis" >> code_analysis.md
          echo "" >> code_analysis.md
          
          # Initialize categorized analysis sections

          echo "" >> code_analysis.md
          echo "### 🚨 **ERRORS (CRITICAL ISSUES)** 🚨" >> code_analysis.md
          echo "" >> code_analysis.md

          echo "" >> code_analysis.md
          # Check for coding conventions and naming standards
          naming_convention_results=$(grep -rn "public.*[a-z][A-Za-z]*\|private.*[A-Z][A-Za-z]*" Assets/ --include="*.cs" 2>/dev/null | head -8 || true)
          if [ -n "$naming_convention_results" ]; then
            echo "#### 📝 **Naming convention issues**" >> code_analysis.md
            echo "*Methods/Properties should use PascalCase, fields should use camelCase*" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Line | Issue |" >> code_analysis.md
            echo "|------|------|-------|" >> code_analysis.md
            echo "$naming_convention_results" | while IFS= read -r line; do
              if [[ $line == *":"* ]]; then
                file=$(echo "$line" | cut -d: -f1)
                line_num=$(echo "$line" | cut -d: -f2)
                code=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
                echo "| \`$(basename "$file")\` | **$line_num** | \`$code\` |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
          fi
          
          # Check for missing XML documentation
          missing_docs_results=$(grep -rn "public.*void\|public.*class\|public.*interface" Assets/ --include="*.cs" | grep -v "///" 2>/dev/null | head -8 || true)
          if [ -n "$missing_docs_results" ]; then
            echo "#### 📚 **Missing summary documentation**" >> code_analysis.md
            echo "*Public methods and classes should have XML documentation*" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Line | Element |" >> code_analysis.md
            echo "|------|------|---------|" >> code_analysis.md
            echo "$missing_docs_results" | while IFS= read -r line; do
              if [[ $line == *":"* ]]; then
                file=$(echo "$line" | cut -d: -f1)
                line_num=$(echo "$line" | cut -d: -f2)
                code=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
                echo "| \`$(basename "$file")\` | **$line_num** | \`$code\` |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
          fi
          
          # Check for region organization in large files
          large_files_results=$(find Assets/ -name "*.cs" -exec wc -l {} \; | awk '$1 > 100 {print $2}' | head -5 || true)
          if [ -n "$large_files_results" ]; then
            echo "#### 🗂️ **Large files without regions**" >> code_analysis.md
            echo "*Consider using #region blocks to organize large scripts*" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Lines | Recommendation |" >> code_analysis.md
            echo "|------|-------|----------------|" >> code_analysis.md
            echo "$large_files_results" | while IFS= read -r file; do
              if [ -n "$file" ]; then
                lines=$(wc -l < "$file" 2>/dev/null || echo "0")
                echo "| \`$(basename "$file")\` | **$lines** | Use regions for organization |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
          fi
          
          # Check for missing namespace declarations
          namespace_results=$(find Assets/ -name "*.cs" -exec grep -L "namespace " {} \; 2>/dev/null | head -8 || true)
          if [ -n "$namespace_results" ]; then
            echo "#### 📁 **Missing namespace declarations**" >> code_analysis.md
            echo "*C# scripts should be wrapped in namespaces*" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File |" >> code_analysis.md
            echo "|------|" >> code_analysis.md
            echo "$namespace_results" | while IFS= read -r file; do
              echo "| \`$(basename "$file")\` |" >> code_analysis.md
            done
            echo "" >> code_analysis.md
          fi
          
          # Check for magic numbers
          magic_numbers_results=$(grep -rn "\b[0-9]\{3,\}\b" Assets/ --include="*.cs" | grep -v "//\|/\*" | head -8 2>/dev/null || true)
          if [ -n "$magic_numbers_results" ]; then
            echo "#### 🔢 **Hardcoded numbers detected**" >> code_analysis.md
            echo "*Consider using named constants for large numbers*" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Line | Value |" >> code_analysis.md
            echo "|------|------|-------|" >> code_analysis.md
            echo "$magic_numbers_results" | while IFS= read -r line; do
              if [[ $line == *":"* ]]; then
                file=$(echo "$line" | cut -d: -f1)
                line_num=$(echo "$line" | cut -d: -f2)
                code=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
                echo "| \`$(basename "$file")\` | **$line_num** | \`$code\` |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
          fi
          
          # Check for expensive Find operations in Update methods
          find_in_update_results=$(grep -rn -A3 -B3 "Update()" Assets/ --include="*.cs" | grep -E "GameObject\.Find|FindObjectOfType|FindObjectsOfType" 2>/dev/null || true)
          if [ -n "$find_in_update_results" ]; then
            echo "#### 🚨 **Find operations in Update methods**" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Line | Issue |" >> code_analysis.md
            echo "|------|------|-------|" >> code_analysis.md
            echo "$find_in_update_results" | while IFS= read -r line; do
              if [[ $line == *":"* ]]; then
                file=$(echo "$line" | cut -d: -f1)
                line_num=$(echo "$line" | cut -d: -f2)
                code=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
                echo "| \`$(basename "$file")\` | **$line_num** | \`$code\` |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
            echo "> ⚠️ **Impact:** Significant performance issue - cache these references in Awake/Start" >> code_analysis.md
            echo "" >> code_analysis.md
          fi

          # Check for critical performance issues - Instantiate/Destroy in Update
          instantiate_destroy_results=$(grep -rn -A2 -B2 "Update()" Assets/ --include="*.cs" | grep -E "Instantiate|Destroy" 2>/dev/null || true)
          if [ -n "$instantiate_destroy_results" ]; then
            echo "#### 🔥 **Instantiate/Destroy in Update methods**" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Line | Issue |" >> code_analysis.md
            echo "|------|------|-------|" >> code_analysis.md
            echo "$instantiate_destroy_results" | while IFS= read -r line; do
              if [[ $line == *":"* ]]; then
                file=$(echo "$line" | cut -d: -f1)
                line_num=$(echo "$line" | cut -d: -f2)
                code=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
                echo "| \`$(basename "$file")\` | **$line_num** | \`$code\` |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
            echo "> ⚠️ **Impact:** Major performance concern - these operations are expensive in Update loops" >> code_analysis.md
            echo "" >> code_analysis.md
          fi
          
          # Check for GetComponent without null checking
          getcomponent_results=$(grep -rn "\.GetComponent<.*>()" Assets/ --include="*.cs" | grep -v "null" 2>/dev/null | head -8 || true)
          if [ -n "$getcomponent_results" ]; then
            echo "#### 💥 **GetComponent calls without null checking**" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Line | Code |" >> code_analysis.md
            echo "|------|------|------|" >> code_analysis.md
            echo "$getcomponent_results" | while IFS= read -r line; do
              if [[ $line == *":"* ]]; then
                file=$(echo "$line" | cut -d: -f1)
                line_num=$(echo "$line" | cut -d: -f2)
                code=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
                echo "| \`$(basename "$file")\` | **$line_num** | \`$code\` |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
            echo "> ⚠️ **Risk:** Potential null reference exceptions" >> code_analysis.md
            echo "" >> code_analysis.md
          fi
          
          # Check for repeated GetComponent calls
          repeated_getcomponent_results=$(grep -rn "\.GetComponent" Assets/ --include="*.cs" | awk -F: '{print $1}' | sort | uniq -c | awk '$1 > 4 {print $2}' | head -5 || true)
          if [ -n "$repeated_getcomponent_results" ]; then
            echo "#### 🔄 **Repeated GetComponent calls**" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Count | Recommendation |" >> code_analysis.md
            echo "|------|-------|----------------|" >> code_analysis.md
            echo "$repeated_getcomponent_results" | while IFS= read -r file; do
              if [ -n "$file" ]; then
                count=$(grep -c "\.GetComponent" "$file" 2>/dev/null || echo "0")
                echo "| \`$(basename "$file")\` | **$count** | Cache component references in Awake/Start |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
            echo "> ⚠️ **Performance:** Multiple GetComponent calls detected - cache references for better performance" >> code_analysis.md
            echo "" >> code_analysis.md
          fi
          
          # Check for uninitialized nullable fields
          nullable_uninitialized_results=$(grep -rn "public.*\?\|private.*\?" Assets/ --include="*.cs" | grep -v "= null\|= default" 2>/dev/null | head -8 || true)
          if [ -n "$nullable_uninitialized_results" ]; then
            echo "#### ❓ **Uninitialized nullable fields**" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Line | Field |" >> code_analysis.md
            echo "|------|------|-------|" >> code_analysis.md
            echo "$nullable_uninitialized_results" | while IFS= read -r line; do
              if [[ $line == *":"* ]]; then
                file=$(echo "$line" | cut -d: -f1)
                line_num=$(echo "$line" | cut -d: -f2)
                code=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
                echo "| \`$(basename "$file")\` | **$line_num** | \`$code\` |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
            echo "> ⚠️ **Risk:** Nullable fields should be explicitly initialized or have null checks" >> code_analysis.md
            echo "" >> code_analysis.md
          fi
          
          # Check for dangerous MonoBehaviour operations in constructors
          constructor_mono_results=$(grep -rn -A5 "public.*:" Assets/ --include="*.cs" | grep -B5 -A5 "MonoBehaviour\|ScriptableObject" | grep "GetComponent\|transform\|gameObject" 2>/dev/null | head -8 || true)
          if [ -n "$constructor_mono_results" ]; then
            echo "#### 🚫 **MonoBehaviour operations in constructors**" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Line | Issue |" >> code_analysis.md
            echo "|------|------|-------|" >> code_analysis.md
            echo "$constructor_mono_results" | while IFS= read -r line; do
              if [[ $line == *":"* ]]; then
                file=$(echo "$line" | cut -d: -f1)
                line_num=$(echo "$line" | cut -d: -f2)
                code=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
                echo "| \`$(basename "$file")\` | **$line_num** | \`$code\` |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
            echo "> ⚠️ **Risk:** Unity objects not available in constructors - use Awake instead" >> code_analysis.md
            echo "" >> code_analysis.md
          fi
          
          # Check for hardcoded file paths
          hardcoded_paths_results=$(grep -rn "Application\.dataPath\|Application\.persistentDataPath.*+.*\"" Assets/ --include="*.cs" 2>/dev/null | head -8 || true)
          if [ -n "$hardcoded_paths_results" ]; then
            echo "#### 📁 **Hardcoded file paths**" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Line | Path Usage |" >> code_analysis.md
            echo "|------|------|------------|" >> code_analysis.md
            echo "$hardcoded_paths_results" | while IFS= read -r line; do
              if [[ $line == *":"* ]]; then
                file=$(echo "$line" | cut -d: -f1)
                line_num=$(echo "$line" | cut -d: -f2)
                code=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
                echo "| \`$(basename "$file")\` | **$line_num** | \`$code\` |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
            echo "> ⚠️ **Risk:** Use Path.Combine() for cross-platform compatibility" >> code_analysis.md
            echo "" >> code_analysis.md
          fi
          
          # Check for missing try-catch in file operations
          file_operations_results=$(grep -rn "File\.\|Directory\." Assets/ --include="*.cs" | grep -v "try\|catch" 2>/dev/null | head -8 || true)
          if [ -n "$file_operations_results" ]; then
            echo "#### 💥 **File operations without exception handling**" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Line | Operation |" >> code_analysis.md
            echo "|------|------|-----------|" >> code_analysis.md
            echo "$file_operations_results" | while IFS= read -r line; do
              if [[ $line == *":"* ]]; then
                file=$(echo "$line" | cut -d: -f1)
                line_num=$(echo "$line" | cut -d: -f2)
                code=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
                echo "| \`$(basename "$file")\` | **$line_num** | \`$code\` |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
            echo "> ⚠️ **Risk:** File operations can throw exceptions - add proper error handling" >> code_analysis.md
            echo "" >> code_analysis.md
          fi
          
          # Check for empty catch blocks
          empty_catch_results=$(grep -rn -A2 "catch" Assets/ --include="*.cs" | grep -A2 "{" | grep "^\s*}\s*$" 2>/dev/null | head -5 || true)
          if [ -n "$empty_catch_results" ]; then
            echo "#### 🕳️ **Empty catch blocks**" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Line | Issue |" >> code_analysis.md
            echo "|------|------|-------|" >> code_analysis.md
            echo "$empty_catch_results" | while IFS= read -r line; do
              if [[ $line == *":"* ]]; then
                file=$(echo "$line" | cut -d: -f1)
                line_num=$(echo "$line" | cut -d: -f2)
                echo "| \`$(basename "$file")\` | **$line_num** | Empty catch block |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
            echo "> ⚠️ **Risk:** Silent exception swallowing - add logging or proper handling" >> code_analysis.md
            echo "" >> code_analysis.md
          fi
          
          # Check for Camera.main usage in Update loops
          camera_main_update_results=$(grep -rn -A3 -B3 "Update()" Assets/ --include="*.cs" | grep "Camera\.main" 2>/dev/null || true)
          if [ -n "$camera_main_update_results" ]; then
            echo "#### 📷 **Camera.main in Update loops**" >> code_analysis.md
            echo "" >> code_analysis.md
            echo "| File | Line | Usage |" >> code_analysis.md
            echo "|------|------|-------|" >> code_analysis.md
            echo "$camera_main_update_results" | while IFS= read -r line; do
              if [[ $line == *":"* ]]; then
                file=$(echo "$line" | cut -d: -f1)
                line_num=$(echo "$line" | cut -d: -f2)
                code=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
                echo "| \`$(basename "$file")\` | **$line_num** | \`$code\` |" >> code_analysis.md
              fi
            done
            echo "" >> code_analysis.md
            echo "> ⚠️ **Performance:** Camera.main uses FindObjectWithTag - cache the reference" >> code_analysis.md
            echo "" >> code_analysis.md
          fi
          
