              fi
            done
            echo "" >> code_analysis.md
          fi
          
          # Check for public field initialization
          public_init_results=$(grep -rn "public.*=.*new" Assets/ --include="*.cs" 2>/dev/null | head -8 || true)
          if [ -n "$public_init_results" ]; then
