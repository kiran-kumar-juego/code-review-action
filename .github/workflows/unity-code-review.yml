          echo "| 🟡 **Warning Issues** | **$warning_issues_count** | $([ $warning_issues_count -lt 5 ] && echo '✅ Good' || echo '⚠️ Review recommended') |" >> code_analysis.md
          echo "" >> code_analysis.md

          echo "" >> code_analysis.md
          
      - name: Upload Analysis Report
        if: (github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true') || (github.event_name == 'workflow_dispatch' && steps.all-files.outputs.any_changed == 'true')
        uses: actions/upload-artifact@v3
        with:
          name: unity-code-analysis-report
          path: |
            code_analysis.md
            pr_comment.md
          retention-days: 30
        continue-on-error: true

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            try {
              const analysisContent = fs.readFileSync('code_analysis.md', 'utf8');
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🤖 AI Code Review - Unity Project\n\n${analysisContent}\n\n---\n*This review was generated automatically by GitHub Copilot AI*`
              });
            } catch (error) {
              console.log('Error reading analysis file:', error);
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🤖 AI Code Review - Unity Project\n\nCode analysis completed for Unity project. The following files were reviewed:\n\n${{ steps.changed-files.outputs.all_changed_files }}\n\n### Key Recommendations:\n- Follow Unity coding standards and best practices\n- Optimize performance-critical code sections\n- Ensure proper error handling and null checks\n- Use appropriate Unity design patterns\n\n---\n*This review was generated automatically by GitHub Copilot AI*`
              });
            }